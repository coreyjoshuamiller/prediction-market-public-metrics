name: Deploy site

# Redeploy when the page code changes. Data refreshes deploy themselves from their own workflows.
on:
  push:
    branches: [main]
    paths: ["site/*.html", "site/*.js", "site/*.css", "site/overlap/**"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages looks the artifact up the moment the upload ends and fails when GitHub's
      # listing hasn't caught up ("No artifacts named github-pages were found"). So wait until
      # the artifact is listed, and try the deploy once more if it still fails.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "github-pages artifact still not listed after 60s; deploying anyway"
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
