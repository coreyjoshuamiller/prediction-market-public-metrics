name: Order book snapshots

# Continuous: each run samples the live 15m Up/Down books once a minute for ~54 minutes,
# rebuilds the chart data, commits, redeploys, then dispatches the next run. GitHub's cron is
# best-effort (runs get delayed by hours or dropped), so it's only a fallback that restarts the
# chain if it ever breaks; the concurrency group keeps at most one run sampling at a time.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: orderbook
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sample order books and Hyperliquid outcome volume
        run: |
          # Hyperliquid keeps no outcome-market volume history, so it's collected while the job runs
          python -u -m pipeline.hyperliquid --duration 3240 --interval 10 &
          python -u -m pipeline.orderbook_snapshot --duration 3240 --interval 60
          wait
      - name: Rebuild order book chart data
        run: python -m pipeline.build_orderbook
      - name: Commit
        run: |
          git config user.name "pm-metrics-bot"
          git config user.email "pm-metrics-bot@users.noreply.github.com"
          git add data/orderbook site/data/orderbook.json data/hyperliquid data/hyperliquid_volume_daily.csv
          if ! git diff --cached --quiet; then
            git commit -q -m "orderbook snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
          git pull -q --rebase  # deploy whatever is newest, including the other workflow's data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # deploy-pages looks the artifact up the moment the upload ends and fails when GitHub's
      # listing hasn't caught up ("No artifacts named github-pages were found"). So wait until
      # the artifact is listed, and try the deploy once more if it still fails.
      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 12); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" --jq .total_count 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then exit 0; fi
            sleep 5
          done
          echo "github-pages artifact still not listed after 60s; deploying anyway"
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retrying the deploy
        if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
      - name: Trigger the daily refresh if data is stale
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # after 13:40 UTC (when yesterday's Kalshi report is reliably on Dune), kick the daily
          # workflow if today's full refresh hasn't run or a source is still behind
          now=$(( $(date -u +%H) * 60 + $(date -u +%M) ))
          if [ "$now" -ge $((13 * 60 + 40)) ] && python -m pipeline.refresh --check; then
            gh workflow run daily.yml --ref main -R "$GITHUB_REPOSITORY"
          fi
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orderbook.yml --ref main -R "$GITHUB_REPOSITORY"
