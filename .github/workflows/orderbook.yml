name: Order book snapshots

# Continuous: each run samples the live 15m Up/Down books once a minute for ~54 minutes,
# rebuilds the chart data, commits, redeploys, then dispatches the next run. GitHub's cron is
# best-effort (runs get delayed by hours or dropped), so it's only a fallback that restarts the
# chain if it ever breaks; the concurrency group keeps at most one run sampling at a time.
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: orderbook
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sample order books
        run: python -u -m pipeline.orderbook_snapshot --duration 3240 --interval 60
      - name: Rebuild order book chart data
        run: python -m pipeline.build_orderbook
      - name: Commit
        run: |
          git config user.name "pm-metrics-bot"
          git config user.email "pm-metrics-bot@users.noreply.github.com"
          git add data/orderbook site/data/orderbook.json
          if ! git diff --cached --quiet; then
            git commit -q -m "orderbook snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          fi
          git pull -q --rebase  # deploy whatever is newest, including the other workflow's data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Trigger the daily refresh if data is stale
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # after 13:40 UTC (when yesterday's Kalshi report is reliably on Dune), kick the daily
          # workflow if today's full refresh hasn't run or a source is still behind
          now=$(( $(date -u +%H) * 60 + $(date -u +%M) ))
          if [ "$now" -ge $((13 * 60 + 40)) ] && python -m pipeline.refresh --check; then
            gh workflow run daily.yml --ref main -R "$GITHUB_REPOSITORY"
          fi
      - name: Start the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orderbook.yml --ref main -R "$GITHUB_REPOSITORY"
