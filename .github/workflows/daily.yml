name: Daily refresh

# Pull the latest history from Dune (Polymarket trades, Kalshi daily reports), refresh the
# leaderboards, rebuild the site data, commit, and redeploy. Kalshi's daily report for day D
# usually lands on Dune the following morning; the job re-queries the last 10 days so a late
# report is picked up on the next run.
#
# GitHub's cron is best-effort (runs can be hours late or dropped), so this is triggered from
# several cron slots AND by the continuous order-book chain whenever data is stale. Every
# trigger runs pipeline/refresh.py, which decides full / light / skip from
# data/refresh_state.json and the data files, so extra triggers cost nothing.
on:
  schedule:
    - cron: "40 13 * * *"
    - cron: "40 16 * * *"
    - cron: "40 19 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto (decide), or force full / light / skip"
        type: choice
        options: [auto, full, light, skip]
        default: auto

concurrency:
  group: daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decide (full / light / skip)
        id: plan
        env:
          FORCE: ${{ github.event.inputs.mode }}
        run: |
          if [ -n "$FORCE" ] && [ "$FORCE" != "auto" ]; then
            python -m pipeline.refresh --check --force "$FORCE" || true
          else
            python -m pipeline.refresh --check || true
          fi
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.mode == 'full'
        with:
          node-version: "22"
      - name: Install XMTP reachability checker
        if: steps.plan.outputs.mode == 'full'
        run: npm ci --prefix tools/xmtp --silent
      - name: Refresh
        if: steps.plan.outputs.mode != 'skip'
        env:
          DUNE_API_KEY: ${{ secrets.DUNE_API_KEY }}
        run: python -u -m pipeline.refresh --auto --today "${{ steps.plan.outputs.run_date }}" --force "${{ steps.plan.outputs.mode }}"
      - name: Commit
        if: steps.plan.outputs.mode != 'skip'
        run: |
          git config user.name "pm-metrics-bot"
          git config user.email "pm-metrics-bot@users.noreply.github.com"
          git add data/*.csv data/*.json site/data/metrics.json site/data/leaders.json
          git commit -q -m "daily refresh ${{ steps.plan.outputs.run_date }} (${{ steps.plan.outputs.mode }})"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          git pull -q --rebase  # deploy whatever is newest, including the other workflow's data
      - uses: actions/configure-pages@v5
        if: steps.plan.outputs.mode != 'skip'
      - uses: actions/upload-pages-artifact@v3
        if: steps.plan.outputs.mode != 'skip'
        with:
          path: site
      - id: deploy
        if: steps.plan.outputs.mode != 'skip'
        uses: actions/deploy-pages@v4
